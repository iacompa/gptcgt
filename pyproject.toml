[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gptcgt"
version = "0.1.0"
description = "Multi-model AI coding terminal — runs multiple AIs on your code, picks the best solution with proof, shows you exactly what it costs."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Mike (IA Compa LLC)" }
]
dependencies = [
    "textual>=0.50.0",
    "litellm>=1.30.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "e2b>=0.17.0",
    "keyring>=25.0.0",
    "pygments>=2.17.0",
    "httpx>=0.27.0",
    "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
    "pre-commit>=3.6.0"
]

[project.scripts]
gptcgt = "src.tui.app:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "D"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D203", "D212", "D415", "D401", "D400", "D205"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
