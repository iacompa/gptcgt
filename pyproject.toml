[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gptcgt"
version = "0.1.0"
description = "Multi-model AI coding terminal — runs multiple AIs on your code, picks the best solution with proof, shows you exactly what it costs."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "IA Compa LLC" }
]
keywords = ["ai", "cli", "terminal", "llm", "coding", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "textual>=0.50.0",
    "litellm>=1.55.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-languages>=1.10.0",
    "e2b>=0.17.0",
    "e2b_code_interpreter>=1.0.0",
    "keyring>=25.0.0",
    "pygments>=2.17.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "tomli-w>=1.0.0",
    "aiohttp>=3.9.0",
    "tiktoken>=0.7.0",
    "workos>=5.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.1.0",
    "stripe>=7.0.0",
    "cryptography>=42.0.0",
    "PyJWT>=2.8.0",
]

[project.urls]
Homepage = "https://gptcgt.ai"
Documentation = "https://gptcgt.ai/docs"
Repository = "https://github.com/iacompa/gptcgt.git"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
    "pre-commit>=3.6.0"
]

[project.scripts]
gptcgt = "src.tui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "D"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D203", "D212", "D415", "D401", "D400", "D205"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
