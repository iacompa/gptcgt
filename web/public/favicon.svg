<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <!-- Dark background -->
    <rect width="512" height="512" rx="112" fill="#05070a" />
    <rect width="512" height="512" rx="112" fill="none" stroke="#1f2937" stroke-width="8" />
    
    <!-- macOS style terminal dots -->
    <circle cx="90" cy="90" r="18" fill="#ef4444" opacity="0.8" />
    <circle cx="145" cy="90" r="18" fill="#f59e0b" opacity="0.8" />
    <circle cx="200" cy="90" r="18" fill="#10b981" opacity="0.8" />

    <!-- 4-Color multi-model gradient -->
    <defs>
        <linearGradient id="prompt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#34D399" />
            <stop offset="33%" stop-color="#60A5FA" />
            <stop offset="66%" stop-color="#A78BFA" />
            <stop offset="100%" stop-color="#FB923C" />
        </linearGradient>
    </defs>

    <!-- > symbol (The Prompt) -->
    <path d="M 130 190 L 290 290 L 130 390" fill="none" stroke="url(#prompt-grad)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- _ cursor (The Code) -->
    <rect x="330" y="326" width="90" height="64" rx="16" fill="#f3f4f6" />
</svg>
